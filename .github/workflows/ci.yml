# Runs the checks on every pull request and every push to main.
# No deploys: this project runs locally only.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel an older run when new commits arrive on the same PR/branch (saves Actions minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt
      # MediaPipe needs these OpenGL/EGL libraries to import on headless Linux.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgles2 libgl1
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests -q

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
