# Documentation keeper. After every push to main, Claude reads the commits
# since the last successful run of this workflow, finds statements in the
# docs that the change made false (flags, defaults, file names, steps,
# messages, the backend outline's function entries), fixes them with the
# smallest edit, and opens (or updates) one pull request for human review
# from the branch docs/pending. Rules: .claude/agents/docs-keeper.md.
#
# The range starts at the head of this workflow's last successful run on
# main (looked up with gh), so no marker file is needed. A push that touches
# only docs/, .claude/ or .github/ is skipped, so a docs PR merging costs
# nothing. Like design-decisions.yml, it runs on workflow_run after
# push-to-main.yml, because the Claude action refuses the push event.
#
# Debugging: the full Claude transcript is printed in the job log and
# uploaded as the artifact claude-execution-output. Run it by hand with
# dry_run to see the report without opening a PR.
#
# Secrets:
#   ANTHROPIC_API_KEY     required
name: Docs upkeep

on:
  workflow_run:
    workflows: ["Push to main"]
    types: [completed]
  workflow_dispatch:
    inputs:
      range:
        description: "Commit range to review, e.g. 762e384..main (default: since this workflow's last successful run)"
        required: false
        default: ""
      dry_run:
        description: "Print the report but do not open or update the review PR"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: read
  id-token: write

concurrency:
  group: docs-upkeep
  cancel-in-progress: false

jobs:
  keep:
    # only a completed push to main; a hand-started run always goes ahead
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Continue the pending docs branch, if there is one
        run: |
          git config user.name "docs-upkeep workflow"
          git config user.email "workflow@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin docs/pending >/dev/null 2>&1; then
            git fetch origin docs/pending
            git merge --no-edit origin/docs/pending
          fi

      - name: Pick the commit range
        id: range
        env:
          INPUT_RANGE: ${{ github.event.inputs.range }}
          GH_TOKEN: ${{ github.token }}
        run: |
          after="$(git rev-parse origin/main)"
          echo "after=$after" >> "$GITHUB_OUTPUT"
          if [ -n "$INPUT_RANGE" ]; then
            range="$INPUT_RANGE"
          else
            # the head of this workflow's last successful run on main, else the previous commit
            since="$(gh run list --workflow docs-upkeep.yml --branch main --status success --limit 1 --json headSha --jq '.[0].headSha' 2>/dev/null || true)"
            if [ -z "$since" ] || ! git cat-file -e "$since" 2>/dev/null; then
              since="$(git rev-parse "$after~1")"
            fi
            range="$since..$after"
          fi
          echo "range=$range" >> "$GITHUB_OUTPUT"
          echo "Reviewing $range"
          git log --oneline "$range"
          if [ "$(git rev-list --count "$range")" = "0" ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
            echo "Nothing new."
            exit 0
          fi
          # commits that change something outside the docs' own machinery
          reviewable="$(git log --format=%h "$range" -- . ':!docs' ':!.claude' ':!.github' | wc -l)"
          if [ "$reviewable" = "0" ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
            echo "Every commit in the range touches only docs/, .claude/ or .github/; nothing to check."
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
            echo "$reviewable commit(s) touch files outside the excluded paths."
          fi

      - name: Check the docs against the change
        if: steps.range.outputs.empty == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are the docs-keeper for this repository. Read .claude/agents/docs-keeper.md
            and follow it exactly: what you may edit, what counts as stale, how to work,
            and the report shape.

            Review the commit range: ${{ steps.range.outputs.range }}

            Fix every documented statement that this range made false, with the smallest
            edit, in the files the rules allow. Do not commit. Write your final report to
            ${{ runner.temp }}/docs-report.md. If nothing was stale, still write the report,
            with "Updated: none", and leave every file untouched.
          show_full_output: true
          claude_args: >-
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(git log *),Bash(git diff *),Bash(git show *),Bash(git rev-parse *)"
            --max-turns 80

      - name: Keep the Claude transcript
        if: always() && steps.range.outputs.empty == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: claude-execution-output
          path: ${{ runner.temp }}/claude-execution-output.json
          if-no-files-found: ignore

      - name: Did any doc change?
        id: changed
        if: steps.range.outputs.empty == 'false'
        run: |
          # the keeper may only touch these; anything else it changed is dropped
          git checkout -- . ':!docs' ':!backend/mocap_pipeline/README.md' ':!desktop/README.md' ':!frontend/README.md' 2>/dev/null || true
          git checkout -- docs/decisions/DECISIONS.md docs/decisions/.last-reviewed 2>/dev/null || true
          if git diff --quiet -- docs backend/mocap_pipeline/README.md desktop/README.md frontend/README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- docs backend/mocap_pipeline/README.md desktop/README.md frontend/README.md
          fi
          if [ -f "$RUNNER_TEMP/docs-report.md" ]; then
            cat "$RUNNER_TEMP/docs-report.md"
          else
            printf 'Range: %s\nUpdated: none\n(no report written)\n' "${{ steps.range.outputs.range }}" > "$RUNNER_TEMP/docs-report.md"
          fi

      - name: Open or update the review PR
        if: steps.range.outputs.empty == 'false' && steps.changed.outputs.changed == 'true' && !inputs.dry_run
        uses: peter-evans/create-pull-request@v7
        with:
          branch: docs/pending
          base: main
          title: "[AI] docs: kept current with ${{ steps.range.outputs.range }}"
          body-path: ${{ runner.temp }}/docs-report.md
          commit-message: "[AI] docs: kept current with ${{ steps.range.outputs.range }}"
          labels: documentation
          reviewers: GianniGuava
          add-paths: docs/**,backend/mocap_pipeline/README.md,desktop/README.md,frontend/README.md
          delete-branch: true
